name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Backup custom files
        working-directory: ./mobile
        run: |
          mkdir -p /tmp/custom_backup
          if [ -f android/gradle.properties ]; then cp android/gradle.properties /tmp/custom_backup/; fi
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/custom_backup/; fi
          if [ -f android/key.properties ]; then cp android/key.properties /tmp/custom_backup/; fi

      - name: Delete broken android folder
        working-directory: ./mobile
        run: rm -rf android

      - name: Regenerate android folder (flutter create)
        working-directory: ./mobile
        run: flutter create --platforms=android --org com.hayidev --project-name hayidev .

      - name: Restore custom files
        working-directory: ./mobile
        run: |
          if [ -f /tmp/custom_backup/gradle.properties ]; then cp /tmp/custom_backup/gradle.properties android/; fi
          if [ -f /tmp/custom_backup/google-services.json ]; then cp /tmp/custom_backup/google-services.json android/app/; fi
          if [ -f /tmp/custom_backup/key.properties ]; then cp /tmp/custom_backup/key.properties android/; fi

      - name: Add gradle optimizations
        working-directory: ./mobile
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Flutter pub get
        working-directory: ./mobile
        run: flutter pub get

      - name: Verify AndroidManifest exists
        working-directory: ./mobile
        run: |
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== MainActivity ==="
          find android -name "MainActivity.*" -exec cat {} \;

      - name: Generate app icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayidev-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
