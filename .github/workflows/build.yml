name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: DIAGNOSTIC — v1 embedding tarama
        working-directory: ./mobile
        run: |
          echo "=== MainActivity dosyalari ==="
          find android -name "MainActivity.*" -type f -exec echo "--- {} ---" \; -exec cat {} \;
          echo ""
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== GeneratedPluginRegistrant ==="
          find . -name "GeneratedPluginRegistrant.*" -type f -exec echo "--- {} ---" \; -exec head -20 {} \;

      - name: Flutter clean
        working-directory: ./mobile
        run: flutter clean

      - name: Flutter pub get
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK (tum ABI)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayidev-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
