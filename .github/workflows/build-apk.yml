name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - name: Create platform files
        working-directory: mobile
        run: flutter create --org com.hayidev --project-name hayi --platforms=android .
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Generate launcher icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons
      - name: Generate splash screen
        working-directory: mobile
        run: flutter pub run flutter_native_splash:create
      - name: Update app label
        working-directory: mobile
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Hayi"/' android/app/src/main/AndroidManifest.xml || true
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayi-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
