name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # Cache: gradle + pub
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/pubspec.yaml', 'mobile/android/**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Platform dosyalarini olustur (sadece yoksa)
      - name: Create platform files
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.hayidev --project-name hayi --platforms=android .
          else
            echo 'android klasoru zaten var, flutter create atlandi'
          fi

      # Bagimliliklar
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      # Ikon config garantiye al
      - name: Ensure icon config
        working-directory: mobile
        run: |
          cat > flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"
            adaptive_icon_background: "#0A3D1E"
            adaptive_icon_foreground: "assets/icon/app_icon.png"
            min_sdk_android: 23
          EOF
          cat > flutter_native_splash.yaml << 'EOF'
          flutter_native_splash:
            color: "#0A3D1E"
            image: "assets/icon/app_icon.png"
            android: true
            ios: false
            fullscreen: true
            android_12:
              image: "assets/icon/app_icon.png"
              icon_background_color: "#0A3D1E"
              color: "#0A3D1E"
          EOF

      # Ikon olustur (hata olsa devam et)
      - name: Generate launcher icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons
        continue-on-error: true

      # Splash olustur (hata olsa devam et)
      - name: Generate splash screen
        working-directory: mobile
        run: flutter pub run flutter_native_splash:create
        continue-on-error: true

      # App label
      - name: Update app label
        working-directory: mobile
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Hayi"/' android/app/src/main/AndroidManifest.xml || true

      # Build (NDK/CMake gerekmemesi icin --no-shrink)
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

      # Yukle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayi-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
